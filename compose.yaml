services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: livesubs-api
    ports:
      - '4000:4000'
    environment:
      PORT: '4000'
      WEB_ORIGIN: 'http://localhost:3000,http://127.0.0.1:3000'
      SAMPLES_DIR: '/app/samples'
    env_file:
      - path: .env
        required: false
      - path: apps/api/.env
        required: false
    volumes:
      - ./samples:/app/samples:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: 'http://localhost:4000'
    container_name: livesubs-web
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: 'http://localhost:4000'
      PORT: '3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
